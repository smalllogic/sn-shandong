# PostgreSQL in every environment; local connections use the current OS user.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: sinower_shandong_development
  url: <%= ENV["DEVELOPMENT_DATABASE_URL"] %>

test:
  <<: *default
  database: sinower_shandong_test
  url: <%= ENV["TEST_DATABASE_URL"] %>

production:
  primary: &primary_production
    <<: *default
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    <<: *primary_production
  queue:
    <<: *primary_production
